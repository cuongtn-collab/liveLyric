<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify LockScreen Hack</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; display: flex; flex-direction: column; justify-content: center; height: 100vh; }
    button { background: #1DB954; color: #000; border: none; padding: 15px; border-radius: 25px; font-weight: bold; margin: 10px; width: 100%; max-width: 300px; }
    #current-line { color: #1DB954; font-size: 1.5rem; font-weight: bold; margin-top: 30px; min-height: 50px; }
    #next-line { color: #777; font-size: 1rem; }
  </style>
</head>
<body>

  <div id="status">Chưa kết nối</div>
  <button id="btn-login">1. Kết nối Spotify</button>
  <button id="btn-sync">2. ÉP CHẠY LOCK SCREEN</button>

  <div id="current-line">Chờ đồng bộ...</div>
  <div id="next-line">---</div>

  <!-- Dùng file MP3 thật (im lặng) từ server thay vì Base64 để đánh lừa iOS -->
  <audio id="silent-audio" loop playsinline src="https://raw.githubusercontent.com/anars/blank-audio/master/1-minute-of-silence.mp3"></audio>

  <script>
    const CLIENT_ID = 'f915e38eaca44da3b7f38e9708f3b6d1';
    const CLIENT_SECRET = 'c7998fe9b4ab4dcb837ec1c9894f54fe';
    const REDIRECT_URI = 'https://cuongtn-collab.github.io/liveLyric/';
    
    let accessToken = localStorage.getItem('sp_acc_token');
    const silentAudio = document.getElementById('silent-audio');

    // Chạm để mở khóa audio
    document.body.addEventListener('touchstart', () => {
      if (silentAudio.paused) silentAudio.play().catch(()=>{});
    }, { once: true });

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('btn-login').addEventListener('click', () => {
        window.location.href = `https://accounts.spotify.com/authorize?response_type=code&client_id=${CLIENT_ID}&scope=user-read-currently-playing&redirect_uri=${REDIRECT_URI}`;
      });

      document.getElementById('btn-sync').addEventListener('click', () => {
        silentAudio.play();
        // Ép iOS ghi nhận đây là trình phát nhạc đang chạy
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        startSync();
      });

      const args = new URLSearchParams(window.location.search);
      const code = args.get('code');
      if (code) {
        window.history.replaceState({}, document.title, window.location.pathname);
        await fetchToken(code);
      }
      if (accessToken) document.getElementById('status').innerText = '✓ Đã kết nối';
    });

    async function fetchToken(code) {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Authorization': `Basic ${btoa(CLIENT_ID+':'+CLIENT_SECRET)}` },
        body: new URLSearchParams({ grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT_URI })
      });
      const data = await res.json();
      if (data.access_token) { accessToken = data.access_token; localStorage.setItem('sp_acc_token', accessToken); document.getElementById('status').innerText = '✓ Đã kết nối'; }
    }

    async function startSync() {
      setInterval(async () => {
        if (!accessToken) return;
        try {
          const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', { headers: { 'Authorization': `Bearer ${accessToken}` } });
          if (res.status !== 200) return;
          const data = await res.json();
          const song = data.item.name;
          const artist = data.item.artists[0].name;
          
          // Giả lập lyrics (Vì LRCLib đôi khi lỗi, ta test bằng tên bài hát trước để xem Lock Screen có hiện không)
          const text1 = `Đang phát: ${song}`;
          const text2 = artist;

          document.getElementById('current-line').innerText = text1;
          document.getElementById('next-line').innerText = text2;

          // CẬP NHẬT LOCK SCREEN LIÊN TỤC
          if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({ title: text1, artist: text2, album: 'Spotify Lyrics' });
          }
        } catch (e) {}
      }, 2000);
    }
  </script>
</body>
</html>
