<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lyrics Lockscreen Hack</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #1db954;
            border-radius: 12px;
            margin-bottom: 20px;
            max-width: 100%;
        }
        button {
            background-color: #1db954;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        /* Ẩn video vì nó chỉ dùng để giữ stream chạy ngầm */
        video {
            display: none; 
        }
    </style>
</head>
<body>

    <h2>Lyrics Sync Lockscreen</h2>
    
    <!-- Canvas để vẽ lời bài hát (sẽ làm ảnh bìa cho Lock Screen) -->
    <canvas id="lyricCanvas" width="600" height="600"></canvas>
    
    <button id="playBtn">Phát Nhạc & Bật Sync</button>

    <!-- Thẻ Audio phát nhạc thật -->
    <audio id="audioPlayer" src="your-song.mp3"></audio> <!-- THAY LINK NHẠC VÀO ĐÂY -->

    <!-- Thẻ Video để chạy ngầm canvas stream giữ tab không bị sleep -->
    <video id="streamVideo" playsinline muted autoplay loop></video>

    <script>
        const canvas = document.getElementById('lyricCanvas');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audioPlayer');
        const streamVideo = document.getElementById('streamVideo');
        const playBtn = document.getElementById('playBtn');

        // Dữ liệu lời bài hát giả lập (Thời gian tính bằng giây)
        const lyrics = [
            { time: 0, text: "🎵 Nhạc dạo..." },
            { time: 5, text: "Look at the stars" },
            { time: 9, text: "Look how they shine for you" },
            { time: 14, text: "And everything you do" },
            { time: 19, text: "Yeah, they were all yellow" },
            { time: 25, text: "🎵 (Instrumental)..." }
        ];

        let currentLyricIndex = -1;

        // Hàm vẽ lời bài hát lên Canvas
        function drawLyricOnCanvas(text) {
            // Xóa nền cũ bằng màu đen (màu nền Spotify)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cài đặt font chữ
            ctx.fillStyle = '#1DB954'; // Xanh Spotify
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Hỗ trợ xuống dòng đơn giản nếu text quá dài (Word Wrap cơ bản)
            const words = text.split(' ');
            let line = '';
            let y = canvas.height / 2 - 20;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                
                if (testWidth > canvas.width - 40 && n > 0) {
                    ctx.fillText(line, canvas.width / 2, y);
                    line = words[n] + ' ';
                    y += 50; // Khoảng cách dòng
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, canvas.width / 2, y);
            
            return canvas.toDataURL('image/png');
        }

        // Cập nhật Media Session API
        function updateMediaSession(lyricText, imageBase64) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: lyricText, // Đưa lời bài hát vào Title để dễ nhìn trên Lock Screen
                    artist: "Spotify Web Hack",
                    album: "Live Lyrics",
                    artwork: [
                        { src: imageBase64, sizes: '600x600', type: 'image/png' }
                    ]
                });
            }
        }

        // Lắng nghe tiến trình bài hát
        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;
            
            // Tìm câu hát hiện tại
            let newLyricIndex = -1;
            for (let i = 0; i < lyrics.length; i++) {
                if (currentTime >= lyrics[i].time && 
                   (i === lyrics.length - 1 || currentTime < lyrics[i + 1].time)) {
                    newLyricIndex = i;
                    break;
                }
            }

            // Nếu câu hát thay đổi, vẽ lại canvas và update màn hình khóa
            if (newLyricIndex !== currentLyricIndex && newLyricIndex !== -1) {
                currentLyricIndex = newLyricIndex;
                const activeText = lyrics[newLyricIndex].text;
                
                const frameData = drawLyricOnCanvas(activeText);
                updateMediaSession(activeText, frameData);
            }
        });

        // Bắt đầu (Bắt buộc phải có tương tác của người dùng trên iOS)
        playBtn.addEventListener('click', async () => {
            try {
                // 1. Vẽ khung hình đầu tiên
                drawLyricOnCanvas("Đang tải...");

                // 2. Chụp luồng từ Canvas (25 frames/giây) 
                // Việc này giữ cho iOS biết trang web đang stream video
                const stream = canvas.captureStream(25);
                streamVideo.srcObject = stream;
                
                // 3. Play video và audio
                await streamVideo.play();
                await audioPlayer.play();

                playBtn.innerText = "Đang phát...";

            } catch (error) {
                console.error("Lỗi khi phát:", error);
                alert("Hãy chắc chắn bạn đã tương tác với trang web và cung cấp đúng link nhạc!");
            }
        });

        // Cấu hình các nút điều khiển (Control) trên màn hình khóa
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', function() { audioPlayer.play(); streamVideo.play(); });
            navigator.mediaSession.setActionHandler('pause', function() { audioPlayer.pause(); streamVideo.pause(); });
            // Có thể thêm 'previoustrack', 'nexttrack', 'seekbackward', 'seekforward'
        }
    </script>
</body>
</html>
