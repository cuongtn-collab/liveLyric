<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Debug - Client Secret</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: monospace; padding: 20px; }
    button { background: #1DB954; border: none; padding: 10px 20px; font-weight: bold; margin: 5px; cursor: pointer; border-radius: 5px;}
    button.danger { background: #e91429; color: white; }
    #log { background: #222; padding: 15px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; margin-top: 20px; min-height: 200px;}
  </style>
</head>
<body>

  <h2>Gỡ lỗi với Client Secret</h2>
  
  <button id="btn-login">1. Đăng nhập Spotify</button>
  <button id="btn-check">2. Kiểm tra Bài Hát Đang Phát</button>
  <button id="btn-clear" class="danger">3. Xóa Dữ Liệu</button>

  <div id="log">Bấm nút 1 để bắt đầu...</div>

  <script>
    const CLIENT_ID = 'f915e38eaca44da3b7f38e9708f3b6d1';
    const CLIENT_SECRET = 'c7998fe9b4ab4dcb837ec1c9894f54fe'; // Đã thêm Secret của bạn
    const REDIRECT_URI = 'https://cuongtn-collab.github.io/liveLyric/';
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    let accessToken = localStorage.getItem('debug_secret_token');
    const logEl = document.getElementById('log');

    function log(msg) {
      console.log(msg);
      logEl.innerHTML += `\n> ${msg}`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('btn-login').addEventListener('click', loginSpotify);
      document.getElementById('btn-check').addEventListener('click', checkSongStatus);
      document.getElementById('btn-clear').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = REDIRECT_URI;
      });

      const args = new URLSearchParams(window.location.search);
      const code = args.get('code');
      const error = args.get('error');

      if (error) log(`[LỖI AUTH] ${error}`);

      if (code) {
        log("Đã nhận Code. Đang dùng Client Secret để đổi Access Token...");
        window.history.replaceState({}, document.title, window.location.pathname);
        await fetchAccessTokenWithSecret(code);
      } else if (accessToken) {
        log("[OK] Đã tìm thấy Access Token (Secret Flow). Sẵn sàng gọi API.");
      }
    });

    function loginSpotify() {
      const params = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: SCOPES,
        redirect_uri: REDIRECT_URI,
        show_dialog: 'true' 
      });
      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function fetchAccessTokenWithSecret(code) {
      const basicAuth = btoa(`${CLIENT_ID}:${CLIENT_SECRET}`);
      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/x-www-form-urlencoded',
            'Authorization': `Basic ${basicAuth}`
          },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: REDIRECT_URI
          })
        });
        
        const data = await response.json();
        if (data.access_token) {
          accessToken = data.access_token;
          localStorage.setItem('debug_secret_token', accessToken);
          log("[THÀNH CÔNG] Đã sinh Access Token bằng Client Secret!");
        } else {
          log(`[LỖI CẤP TOKEN] ${JSON.stringify(data)}`);
        }
      } catch (err) {
        log(`[LỖI MẠNG] ${err.message}`);
      }
    }

    async function checkSongStatus() {
      if (!accessToken) {
        log("[CẢNH BÁO] Chưa có Token. Bấm lại nút 1.");
        return;
      }
      
      log("--- Gọi API Bài Hát ---");
      try {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });

        log(`Status Code: ${response.status}`);

        if (response.status === 204) {
          log("[204] Gọi thành công, nhưng nhạc đang Tắt trên thiết bị.");
          return;
        }

        const textData = await response.text();
        
        if (!response.ok) {
          log(`[LỖI ${response.status}] RAW DATA TỪ SPOTIFY: ${textData}`);
        } else {
          const data = JSON.parse(textData);
          log(`[THÀNH CÔNG] Đang phát: ${data.item.name} - ${data.item.artists[0].name}`);
        }
      } catch (err) {
        log(`[LỖI GỌI API] ${err.message}`);
      }
    }
  </script>
</body>
</html>
