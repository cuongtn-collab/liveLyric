<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Realtime Lyrics PWA</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 { color: #1DB954; font-size: 1.4rem; margin-bottom: 10px; }
    .status { color: #888; font-size: 0.9rem; margin-bottom: 20px; }

    .btn {
      background-color: #1DB954;
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin: 8px;
    }

    #lyrics-container {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #181818;
      width: 100%;
      max-width: 400px;
    }

    .current-line { color: #1DB954; font-size: 1.3rem; font-weight: bold; margin-bottom: 8px; }
    .next-line { color: #888; font-size: 1rem; }

    canvas, video { display: none; }
  </style>
</head>
<body>

  <h1>Spotify Realtime Lyrics</h1>
  <div id="status" class="status">Chưa đăng nhập Spotify</div>

  <button class="btn" onclick="loginSpotify()">1. Kết nối Spotify</button>
  <button class="btn" onclick="startSync()">2. Bật Lời LockScreen</button>
  <button class="btn" onclick="togglePiP()">3. Bật Cửa sổ nổi (PiP)</button>

  <div id="lyrics-container">
    <div id="current-line" class="current-line">Vui lòng bấm Kết nối Spotify</div>
    <div id="next-line" class="next-line">---</div>
  </div>

  <audio id="silent-audio" loop src="https://raw.githubusercontent.com/anron/silent-audio/master/silent-10sec.mp3"></audio>
  <canvas id="pip-canvas" width="600" height="300"></canvas>
  <video id="pip-video" autoplay playsinline muted></video>

  <script>
    // === CẤU HÌNH SPOTIFY ===
    const CLIENT_ID = '44ec39575f584e37935e2a5f74f56704'; // Điền Client ID từ Spotify Dashboard
    const REDIRECT_URI = window.location.href.split('#')[0].split('?')[0];
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    let accessToken = localStorage.getItem('access_token');
    let currentTrack = '';
    let parsedLyrics = [];
    let syncTimer = null;

    const silentAudio = document.getElementById('silent-audio');
    const canvas = document.getElementById('pip-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pip-video');

    // === CÁC HÀM XỬ LÝ PKCE AUTHENTICATION ===
    function generateRandomString(length) {
      let text = '';
      let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
      }
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
