<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Lyrics LockScreen & PiP</title>
  
  <!-- Cấu hình Web App PWA cho iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lyrics PWA">

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 { color: #1DB954; font-size: 1.5rem; margin-bottom: 20px; }

    .btn {
      background-color: #1DB954;
      color: #000000;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin: 10px;
      transition: background-color 0.2s;
    }
    .btn:active { background-color: #1ed760; }

    #lyrics-display {
      margin-top: 30px;
      font-size: 1.4rem;
      font-weight: 600;
      min-height: 80px;
      color: #ffffff;
    }

    /* Thẻ Canvas ẩn dùng để tạo luồng Video PiP */
    #pip-canvas { display: none; }
    #pip-video { display: none; }
  </style>
</head>
<body>

  <h1>Spotify Lyrics LockScreen / PiP</h1>

  <button class="btn" onclick="startAudioSession()">1. Bật Lời trên Màn hình khóa</button>
  <button class="btn" onclick="togglePiP()">2. Bật Cửa sổ nổi (PiP)</button>

  <div id="lyrics-display">Bấm nút để bắt đầu phát lời nhạc...</div>

  <!-- Thẻ Audio im lặng giữ kết nối Media Session -->
  <audio id="silent-audio" loop src="https://raw.githubusercontent.com/anron/silent-audio/master/silent-10sec.mp3"></audio>

  <!-- Canvas và Video tạo khung Picture-in-Picture -->
  <canvas id="pip-canvas" width="600" height="300"></canvas>
  <video id="pip-video" autoplay playsinline muted></video>

  <script>
    // 1. Dữ liệu Lời bài hát giả lập dạng .LRC (Mốc thời gian theo Giây)
    const mockLyrics = [
      { time: 0, current: "Đang tải bài hát...", next: "Chuẩn bị..." },
      { time: 3, current: "Lời bài hát dòng thứ nhất...", next: "Dòng thứ hai chuẩn bị tới..." },
      { time: 7, current: "Dòng thứ hai chuẩn bị tới...", next: "Và đây là dòng thứ ba..." },
      { time: 12, current: "Và đây là dòng thứ ba...", next: "Hát tiếp câu tiếp theo..." },
      { time: 16, current: "Hát tiếp câu tiếp theo...", next: "Kết thúc đoạn điệp khúc" }
    ];

    let currentLyricIndex = 0;
    const silentAudio = document.getElementById('silent-audio');
    const lyricsDisplay = document.getElementById('lyrics-display');

    // Setup Canvas cho Picture-in-Picture
    const canvas = document.getElementById('pip-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pip-video');

    // 2. Kích hoạt Audio Session & Lock Screen Controls
    function startAudioSession() {
      silentAudio.play().then(() => {
        updateLyrics(mockLyrics[0].current, mockLyrics[0].next);
        startDemoSync();
      }).catch(err => {
        alert("Vui lòng tương tác với màn hình trước khi bật Audio.");
      });
    }

    // 3. Cập nhật lời nhạc lên Media Session (Lock Screen) và Canvas (PiP)
    function updateLyrics(currentLine, nextLine) {
      // Cập nhật giao diện Web
      lyricsDisplay.innerText = currentLine;

      // A. Đẩy dữ liệu lên Màn hình khóa (Lock Screen)
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: currentLine,  // Dòng chữ to
          artist: nextLine,    // Dòng chữ nhỏ bên dưới
          album: 'Spotify Lyrics PWA',
          artwork: [
            { src: 'https://via.placeholder.com/512/1DB954/000000?text=Lyrics', sizes: '512x512', type: 'image/png' }
          ]
        });
      }

      // B. Vẽ lời nhạc lên Canvas phục vụ Picture-in-Picture
      drawCanvasLyrics(currentLine, nextLine);
    }

    // 4. Vẽ Lời lên Canvas
    function drawCanvasLyrics(current, next) {
      ctx.fillStyle = '#121212';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#1DB954';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(current, canvas.width / 2, 130);

      ctx.fillStyle = '#888888';
      ctx.font = '22px sans-serif';
      ctx.fillText(next, canvas.width / 2, 190);
    }

    // 5. Bật / Tắt Cửa sổ nổi Picture-in-Picture
    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          // Chuyển luồng Canvas thành Video
          const stream = canvas.captureStream(30);
          video.srcObject = stream;
          await video.play();
          await video.requestPictureInPicture();
        }
      } catch (err) {
        alert("Trình duyệt không hỗ trợ PiP hoặc cần thao tác từ người dùng.");
      }
    }

    // 6. Tự động chạy giả lập đồng bộ thời gian (Demo)
    function startDemoSync() {
      setInterval(() => {
        currentLyricIndex = (currentLyricIndex + 1) % mockLyrics.length;
        const line = mockLyrics[currentLyricIndex];
        updateLyrics(line.current, line.next);
      }, 4000); // Đổi câu mỗi 4 giây
    }
  </script>
</body>
</html>
